<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HouseOps</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/styles.css">
  <meta name="theme-color" content="#000000">
</head>
<body>
  <!-- Header -->
  <header class="topbar">
    <div class="brand">
      <span>⚡ HouseOps</span>
    </div>
    <div class="top-pills">
      <div class="status-chip active" id="chipSync">
        <span>●</span> Google Sync
      </div>
      <div class="status-chip" id="chipQuiet">
        <span>🌙</span> Quiet: Off
      </div>
      <button class="btn btn-primary" onclick="openNewTicketModal()" style="padding:6px 12px; font-size:12px;">
        ➕ New Task
      </button>
    </div>
  </header>

  <!-- Navigation Tabs -->
  <nav class="tab-nav">
    <button class="nav-tab active" id="tabBtnActive" onclick="switchTab('active')">
      📋 Active Work Orders (<span id="countActive">0</span>)
    </button>
    <button class="nav-tab" id="tabBtnFloated" onclick="switchTab('floated')">
      ⏳ Floated / Slipped (<span id="countFloated">0</span>)
    </button>
    <button class="nav-tab" id="tabBtnAudit" onclick="switchTab('audit')">
      📸 Verified History
    </button>
  </nav>

  <!-- Main Content -->
  <main class="main-content" id="mainContent">
    <!-- Active Grid -->
    <div id="viewActive" class="grid-container"></div>

    <!-- Floated Grid -->
    <div id="viewFloated" class="grid-container" style="display:none;"></div>

    <!-- Audit Log -->
    <div id="viewAudit" style="display:none; display:flex; flex-direction:column; gap:10px;"></div>
  </main>

  <!-- Hidden native camera input for 1-tap verify -->
  <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;" onchange="handlePhotoCaptured(this)">

  <!-- New Task Modal -->
  <div class="modal-backdrop" id="newTicketModal" onclick="if(event.target===this) closeNewTicketModal()">
    <div class="modal-card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 style="font-size:16px;">➕ Create House Task</h3>
        <button class="btn" onclick="closeNewTicketModal()" style="flex:0; padding:4px 8px;">✖</button>
      </div>

      <div class="form-group">
        <label>Task Title</label>
        <input type="text" class="form-input" id="inpTitle" placeholder="e.g. Feed Dogs (Morning)">
      </div>

      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
        <div class="form-group">
          <label>Category</label>
          <select class="form-input" id="inpCategory">
            <option value="General">General Housework</option>
            <option value="Kitchen">Kitchen</option>
            <option value="HVAC">HVAC & Filters</option>
            <option value="Bathrooms">Bathrooms</option>
            <option value="Trash">Trash & Recycling</option>
            <option value="Yard">Yard & Garage</option>
          </select>
        </div>

        <div class="form-group">
          <label>Assignee</label>
          <select class="form-input" id="inpAssignee">
            <option value="Son">Son (Teenager)</option>
            <option value="Dad">Dad (Father)</option>
            <option value="Family">Shared / Anyone</option>
          </select>
        </div>
      </div>

      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
        <div class="form-group">
          <label>Priority</label>
          <select class="form-input" id="inpPriority">
            <option value="P2-Normal">P2 - Normal</option>
            <option value="P1-Urgent">P1 - Urgent / Critical</option>
            <option value="P3-Low">P3 - Low Priority</option>
          </select>
        </div>

        <div class="form-group">
          <label>Target Time</label>
          <input type="time" class="form-input" id="inpTime" value="06:15" style="color-scheme: dark;">
        </div>
      </div>

      <div class="form-group">
        <label>Recurrence</label>
        <select class="form-input" id="inpRecurrence" onchange="toggleRecurrenceOptions(this.value)">
          <option value="Weekdays">Weekdays (Mon - Fri)</option>
          <option value="Daily">Daily (Every Day)</option>
          <option value="Weekends">Weekends Only (Sat - Sun)</option>
          <option value="DaysOfWeek">Custom Days of Week</option>
          <option value="Weekly">Weekly (Every 7 days)</option>
          <option value="IntervalDays">Custom Interval (Days)</option>
        </select>
      </div>

      <!-- Custom Days of Week Selector -->
      <div class="form-group" id="grpDaysOfWeek" style="display:none;">
        <label>Select Days of Week</label>
        <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:2px;">
          <button type="button" class="day-chip active" data-day="1" onclick="toggleDayChip(this)">M</button>
          <button type="button" class="day-chip active" data-day="2" onclick="toggleDayChip(this)">Tu</button>
          <button type="button" class="day-chip active" data-day="3" onclick="toggleDayChip(this)">W</button>
          <button type="button" class="day-chip active" data-day="4" onclick="toggleDayChip(this)">Th</button>
          <button type="button" class="day-chip active" data-day="5" onclick="toggleDayChip(this)">F</button>
          <button type="button" class="day-chip" data-day="6" onclick="toggleDayChip(this)">Sa</button>
          <button type="button" class="day-chip" data-day="0" onclick="toggleDayChip(this)">Su</button>
        </div>
      </div>

      <div class="form-group" id="grpIntervalDays" style="display:none;">
        <label>Interval in Days</label>
        <input type="number" class="form-input" id="inpIntervalDays" value="60" min="1">
      </div>

      <!-- Spoken Voice Reminders Section -->
      <div style="border-top:1px solid var(--border); padding-top:12px; margin-top:6px; display:flex; flex-direction:column; gap:10px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:13px; font-weight:700; color:var(--accent);">📢 Spoken Voice Reminders</span>
        </div>

        <div class="form-group">
          <label>Broadcast Timing</label>
          <select class="form-input" id="inpBroadcastTiming">
            <option value="exact">At Scheduled Time (e.g. 6:15 AM)</option>
            <option value="15m_before">15 Minutes Before</option>
            <option value="overdue">When Overdue (If Missed)</option>
            <option value="none">Off (No Spoken Reminders)</option>
          </select>
        </div>

        <div class="form-group">
          <label>Target Speakers (Multi-Select)</label>
          <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:2px;" id="speakerChips">
            <button type="button" class="speaker-chip active" data-speaker="All Rooms" onclick="toggleSpeakerChip(this)">All Rooms</button>
            <button type="button" class="speaker-chip" data-speaker="Camden's Clock" onclick="toggleSpeakerChip(this)">Camden's Clock</button>
            <button type="button" class="speaker-chip" data-speaker="Kitchen display" onclick="toggleSpeakerChip(this)">Kitchen display</button>
            <button type="button" class="speaker-chip" data-speaker="Living Room display" onclick="toggleSpeakerChip(this)">Living Room display</button>
            <button type="button" class="speaker-chip" data-speaker="Sawyer's Mini" onclick="toggleSpeakerChip(this)">Sawyer's Mini</button>
            <button type="button" class="speaker-chip" data-speaker="Bedroom speaker" onclick="toggleSpeakerChip(this)">Bedroom speaker</button>
            <button type="button" class="speaker-chip" data-speaker="Bathroom speaker" onclick="toggleSpeakerChip(this)">Bathroom speaker</button>
          </div>
        </div>

        <div class="form-group">
          <label>Custom Spoken Phrase (Optional)</label>
          <input type="text" class="form-input" id="inpBroadcastMessage" placeholder="e.g. Camden, it's time to feed the dogs!">
        </div>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:8px;">
        <button class="btn" onclick="closeNewTicketModal()">Cancel</button>
        <button class="btn btn-primary" onclick="submitNewTicket()">Create Task</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
